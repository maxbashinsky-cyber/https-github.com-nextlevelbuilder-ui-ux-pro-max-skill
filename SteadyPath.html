function lookupSalary(title,location){
  if(!title?.trim())return null;
  const t=title.toLowerCase().trim().replace(/[^\w\s]/g,"");
  const loc=(location||"").toLowerCase().trim();
  const mult=COL_MULT[loc]||1.00;
  if(SALARY_DB[t])return{title,medianSalary:Math.round(SALARY_DB[t]*mult),baseSalary:SALARY_DB[t],multiplier:mult,location:location||"US Avg",confidence:"high"};
  const words=t.split(/\s+/).filter(w=>w.length>2);
  let best=null,score=0;
  for(const k of Object.keys(SALARY_DB)){
    const kw=k.split(/\s+/);let m=0;
    for(const w of words)if(kw.some(x=>x.includes(w)||w.includes(x)))m++;
    const s=m/Math.max(words.length,kw.length);
    if(s>score&&s>0.4){score=s;best=k}
  }
  if(best)return{title:best,medianSalary:Math.round(SALARY_DB[best]*mult),baseSalary:SALARY_DB[best],multiplier:mult,location:location||"US Avg",confidence:"medium"};
  return null;
}

// ═══ MONTE CARLO ═══
function boxMuller(){let u,v;do{u=Math.random()}while(!u);do{v=Math.random()}while(!v);return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

function runMC({startAge,endAge,savings,annualContrib,contribGrowth,mu,sigma,n,matchAmount}){
  const years=Math.max(1,endAge-startAge);
  const paths=[];
  for(let i=0;i<n;i++){
    const path=[Math.max(0,savings)];
    let c=annualContrib;const m=matchAmount||0;
    for(let y=0;y<years;y++){
      const r=mu+sigma*boxMuller();
      path.push(Math.max(0,path[path.length-1]*(1+r)+c+m));
      c*=(1+contribGrowth);
    }
    paths.push(path);
  }
  const sorted=(idx)=>...[paths.map(p=>p[idx])].sort((a,b)=>a-b);
  const pct=(arr,p)=>arr[Math.floor(arr.length*p/100)];
  const P={p5:[],p10:[],p25:[],p50:[],p75:[],p90:[],p95:[]};
  for(let i=0;i<=years;i++){
    const s=sorted(i);
    Object.keys(P).forEach(k=>{P[k].push(pct(s,parseInt(k.slice(1))))});
  }
  return{...P,years,startAge,endAge};
}

// ═══ CAREER ═══
function projectCareer(age,retireAge,income,type){
  const profiles={
    tech:{peakAge:42,peakMult:2.8,lateGr:0.02},finance:{peakAge:44,peakMult:3.5,lateGr:0.02},
    healthcare:{peakAge:50,peakMult:2.3,lateGr:0.02},education:{peakAge:52,peakMult:1.7,lateGr:0.02},
    law:{peakAge:48,peakMult:3.1,lateGr:0.02},creative:{peakAge:38,peakMult:1.9,lateGr:0.01},
    trades:{peakAge:40,peakMult:2.0,lateGr:0.01},gig:{peakAge:36,peakMult:1.6,lateGr:0.00},
    general:{peakAge:45,peakMult:2.2,lateGr:0.02},
  };
  const p=profiles[type]||profiles.general;
  const earnings=[];let inc=income;
  for(let a=age;a<=retireAge;a++){
    if(a<p.peakAge){
      const prog=(a-age)/Math.max(1,p.peakAge-age);
      inc=income+(income*p.peakMult-income)*Math.pow(prog,0.65);
    }else inc*=(1+p.lateGr);
    earnings.push({age:a,income:Math.round(inc)});
  }
  const total=earnings.reduce((s,e)=>s+e.income,0);
  const peak=Math.max(...earnings.map(e=>e.income));
  const peakAge=earnings.find(e=>e.income===peak)?.age;
  return{earnings,total,peak,peakAge,profile:p};
}

  if(/doctor|physician|surgeon|nurse|medical|health|pharma|therap|dental/.test(t))return"healthcare";
  if(/teacher|professor|educat|school/.test(t))return"education";

  if(/electric|plumb|carpent|trades|mechanic|welder|hvac/.test(t))return"trades";

function calcTax(income){
  const b=[[11600,0.10],[47150,0.12],[100525,0.22],[191950,0.24],[243725,0.32],[609350,0.35],[Infinity,0.37]];

const fmt=(n)=>{if(n==null||isNaN(n))return"—";const s=n<0?"-":"",a=Math.abs(n);if(a>=1e9)return s+"$"+(a/1e9).toFixed(2)+"B";if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M";if(a>=1e3)return s+"$"+Math.round(a/1e3)+"K";return s+"$"+Math.round(a)};

function calcVitals(p,mc){
  const ss=Math.min(100,(p.savingsRate/20)*100);
  const em=(p.savings*0.3)/(p.income/12);
  const es=Math.min(100,(em/6)*100);
  const ds=p.totalDebt>0?Math.max(0,100-(p.totalDebt/p.income)*100):100;

function useWidth(ref,fallback=600){
  const[w,setW]=useState(fallback);
  useEffect(()=>{
    if(!ref?.current)return;
    const obs=new ResizeObserver(es=>setW(Math.max(240,es[0].contentRect.width)));
    obs.observe(ref.current);
    setW(Math.max(240,ref.current.offsetWidth||fallback));
    return()=>obs.disconnect();
  },[ref]);
  return w;
}

  const{p5,p10,p25,p50,p75,p90,p95,years,startAge}=data;

  const line=(arr)=>arr.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");

      xTicks.map((i,idx)=>h("text",{key:idx,x:x(i),y:height-6,fill:"#5a6878",fontSize:"9.5",fontFamily:"JetBrains Mono",textAnchor:"middle"},startAge+i)),
      h("path",{d:band(p95,p5),fill:"url(#g1)"}),
      h("path",{d:band(p75,p25),fill:"url(#g2)"}),
      h("path",{d:line(p10),fill:"none",stroke:"rgba(125,214,168,0.3)",strokeDasharray:"3,4"}),
      h("path",{d:line(p90),fill:"none",stroke:"rgba(125,214,168,0.3)",strokeDasharray:"3,4"}),
      h("path",{d:line(p50),fill:"none",stroke:"url(#ml)",strokeWidth:"2.5"}),
      h("circle",{cx:x(years),cy:y(p50[years]),r:5,fill:"#f0c674"}),
      h("circle",{cx:x(years),cy:y(p50[years]),r:8,fill:"#f0c674",opacity:"0.2"})
    )
  );
}

function CareerChart({data,height=160}){
  const ref=useRef(null);const w=useWidth(ref,560);
  if(!data?.earnings?.length)return h("div",{ref,style:{height}});
  const{earnings,peak,peakAge}=data;
  const pad={t:10,r:10,b:24,l:48};
  const cw=w-pad.l-pad.r,ch=height-pad.t-pad.b;
  const bw=Math.max(2,cw/earnings.length-1);
  return h("div",{ref,style:{width:"100%"}},
    h("svg",{width:w,height,style:{display:"block"}},
      h("defs",null,
        h("linearGradient",{id:"bar",x1:"0",y1:"0",x2:"0",y2:"1"},h("stop",{offset:"0%",stopColor:"#7dd6a8",stopOpacity:"0.75"}),h("stop",{offset:"100%",stopColor:"#5ab589",stopOpacity:"0.25"})),
        h("linearGradient",{id:"peak",x1:"0",y1:"0",x2:"0",y2:"1"},h("stop",{offset:"0%",stopColor:"#f0c674"}),h("stop",{offset:"100%",stopColor:"#d4a849",stopOpacity:"0.5"}))),
      [0,0.5,1].map((p,i)=>h("g",{key:i},
        h("line",{x1:pad.l,y1:pad.t+ch*(1-p),x2:w-10,y2:pad.t+ch*(1-p),stroke:"rgba(255,255,255,0.04)"}),
        h("text",{x:pad.l-8,y:pad.t+ch*(1-p)+3,fill:"#5a6878",fontSize:"9",textAnchor:"end",fontFamily:"JetBrains Mono"},fmt(peak*p)))),
      earnings.map((e,i)=>{
        const bh=(e.income/peak)*ch;const xp=pad.l+(i/earnings.length)*cw;
        return h("rect",{key:i,x:xp,y:pad.t+ch-bh,width:bw,height:bh,fill:e.age===peakAge?"url(#peak)":"url(#bar)",rx:"1"});
      }),
      earnings.filter((_,i)=>i%Math.max(1,Math.floor(earnings.length/6))===0).map((e,i)=>{
        const xp=pad.l+(earnings.indexOf(e)/earnings.length)*cw;
        return h("text",{key:i,x:xp+bw/2,y:height-6,fill:"#5a6878",fontSize:"9",textAnchor:"middle",fontFamily:"JetBrains Mono"},e.age);
      })
    )
  );
}

function VitalsGauge({score,size=160}){
  const pct=(score-300)/550;
  const color=score>=720?"#7dd6a8":score>=550?"#f0c674":"#e88b8b";
  const r=size/2-14;
  const circ=2*Math.PI*r*0.75;
  const dash=circ*Math.max(0,Math.min(1,pct));
  return h("svg",{width:size,height:size,viewBox:`0 0 ${size} ${size}`},
    h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"rgba(255,255,255,0.05)",strokeWidth:"10",strokeDasharray:`${circ} ${2*Math.PI*r*0.25}`,strokeLinecap:"round",transform:`rotate(135 ${size/2} ${size/2})`}),
    h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:color,strokeWidth:"10",strokeDasharray:`${dash} ${circ-dash+2*Math.PI*r*0.25}`,strokeLinecap:"round",transform:`rotate(135 ${size/2} ${size/2})`,style:{transition:"stroke-dasharray 1.5s"}}),
    h("text",{x:size/2,y:size/2-2,fill:"#e8edf2",fontSize:"34",fontWeight:"500",textAnchor:"middle",fontFamily:"Fraunces"},score),
    h("text",{x:size/2,y:size/2+18,fill:"#5a6878",fontSize:"10",textAnchor:"middle",fontFamily:"JetBrains Mono"},"/ 850")
  );
}

function Donut({alloc,size=120}){
  const items={l:"Equity",v:alloc.eq,c:"#7dd6a8"},{l:"Bonds",v:[alloc.bd,c:"#f0c674"},{l:"Alts",v:alloc.al,c:"#a594d4"},{l:"Cash",v:alloc.ca,c:"#5fb8d6"}];
  const tot=items.reduce((s,d)=>s+d.v,0);
  const cx=size/2,cy=size/2,rO=size/2-6,rI=rO*0.65;
  let cum=-Math.PI/2;
  return h("svg",{width:size,height:size},
    items.map((d,i)=>{
      const a=(d.v/tot)*2*Math.PI;const s=cum;cum+=a;const lg=a>Math.PI?1:0;
      const p=`M${cx+rO*Math.cos(s)},${cy+rO*Math.sin(s)} A${rO},${rO} 0 ${lg},1 ${cx+rO*Math.cos(cum)},${cy+rO*Math.sin(cum)} L${cx+rI*Math.cos(cum)},${cy+rI*Math.sin(cum)} A${rI},${rI} 0 ${lg},0 ${cx+rI*Math.cos(s)},${cy+rI*Math.sin(s)} Z`;
      return h("path",{key:i,d:p,fill:d.c,opacity:"0.85"});
    }),
    h("text",{x:cx,y:cy+5,fill:"#e8edf2",fontSize:"16",fontWeight:"600",textAnchor:"middle",fontFamily:"Fraunces"},alloc.eq+"%")
  );
}

// STEADY AI — WORKING ANALYSIS ENGINE WITH 20+ INTENT CLASSIFICATIONS

function analyzeQuery(q, profile, career, mc, vitals, plaidData, alloc) {
  const ql = q.toLowerCase().trim();
  const tax = calcTax(profile.income);
  const matchInfo = MATCH_OPT[profile.employerMatchKey];
  const matchAmount = profile.income * matchInfo.rate;
  const annualContrib = profile.income * profile.savingsRate / 100;
  const yrsToRetire = profile.retireAge - profile.age;
  const p50F = mc.p50[mc.p50.length-1];
  const p10F = mc.p10[mc.p10.length-1];
  const p90F = mc.p90[mc.p90.length-1];
  
  const intents = [
    { p:/\b(early retire|retire early|retire at (5[0-9]|6[0-4])|fire\b|financial independence)\b/, k:"early_retire" },
    { p:/\b(market (crash|down|drop)|crash|sell.*now|panic|bear market|recession)\b/, k:"market_panic" },
    { p:/\b(roth|traditional|ira|401k|401\(k\)|contribution|match|employer)\b/, k:"retirement_account" },
    { p:/\b(tax|bracket|marginal|effective|deduction|tax.loss)\b/, k:"tax_strategy" },
    { p:/\b(vitals|score|grade|health)\b/, k:"vitals" },
    { p:/\b(save more|savings rate|increase savings|budget)\b/, k:"savings_increase" },
    { p:/\b(debt|loan|credit card|student loan|pay off)\b/, k:"debt_strategy" },
    { p:/\b(net worth|total worth|assets)\b/, k:"net_worth" },
    { p:/\b(career|salary|raise|promotion|job change|negotiate)\b/, k:"career" },
    { p:/\b(portfolio|allocation|stocks|bonds|diversif|rebalanc)\b/, k:"portfolio" },
    { p:/\b(monte carlo|p50|p10|p90|probability|odds|chance|scenario)\b/, k:"monte_carlo" },
    { p:/\b(emergency|rainy day)\b/, k:"emergency_fund" },
    { p:/\b(house|home|down payment|mortgage)\b/, k:"home_purchase" },
    { p:/\b(kid|child|baby|529|college fund)\b/, k:"children" },
    { p:/\b(social security|ss\b)\b/, k:"social_security" },
    { p:/\b(inflation|purchasing power|real return)\b/, k:"inflation" },
    { p:/\b(risk|volatility|conservative|aggressive)\b/, k:"risk_profile" },
    { p:/\b(auto.?invest|automatic|transfer|deposit)\b/, k:"auto_invest" },
    { p:/\b(fee|cost|pricing|price|charge|subscription|5 dollar|\$5|expensive)\b/, k:"pricing" },
    { p:/\b(wealthfront|betterment|vanguard|fidelity|compare|versus|vs )\b/, k:"competitor" },
    { p:/\b(hi|hello|hey|help|what can you|who are you)\b/, k:"greeting" },
  ];
  
  let intent = "general";
  for (const i of intents) if (i.p.test(ql)) { intent = i.k; break; }
  
  const ageMatch = ql.match(/\b(\d{2})\b/);
  
  const R = {
    early_retire: () => {
      const target = ageMatch ? parseInt(ageMatch[1]) : 60;
      if (target >= profile.retireAge) return `You're already planning to retire at ${profile.retireAge}.`;
      const gap = profile.retireAge - target;
      const lostEarn = career.earnings.filter(e => e.age >= target && e.age < profile.retireAge).reduce((s,e)=>s+e.income,0);
      const newYrs = target - profile.age;
      const scale = newYrs / yrsToRetire;
      const newP50 = p50F * Math.pow(scale, 1.3);
      const fire = (profile.income * 0.7) * 25;
      const short = fire - newP50;
      const boost = short > 0 ? Math.ceil((short / (profile.income * newYrs * 3.8)) * 100) : 0;
      return `**Retiring at ${target} analysis:**\n\n` +
        `• You'd work ${gap} fewer years, missing ${fmt(lostEarn)} in lifetime income\n` +
        `• Projected wealth at ${target}: ~${fmt(newP50)} (vs ${fmt(p50F)} at ${profile.retireAge})\n` +
        `• FIRE target (25x annual spend): ${fmt(fire)}\n` +
        (short > 0
          ? `• **Shortfall:** ${fmt(short)}. Bump savings from ${profile.savingsRate}% to ~${Math.min(40, profile.savingsRate + boost)}% to close it.\n`
          : `• **You're ahead of FIRE** by ${fmt(-short)}! ${target} is feasible.\n`);
    },
    market_panic: () => {
      const dd = Math.min(40, Math.max(15, Math.round(RISK[profile.riskProfile].sigma * 2.3 * 100)));
      return `**Stay the course, ${profile.name}. The data:**\n\n` +
        `📊 Every S&P 500 drop of 20%+ since 1950 has fully recovered — avg 14 months\n` +
        `📊 Panic sellers end up 40% behind buy-and-hold investors\n` +
        `📊 Your ${yrsToRetire}-year horizon makes a 30% drawdown mathematically irrelevant\n\n` +
        `**Your specific math:**\n` +
        `• P10 scenario already bakes in ~${dd}% drawdown → still reach ${fmt(p10F)}\n` +
        `• Auto-invest during downturns BUYS MORE SHARES cheaper\n` +
        `• A 30% crash costs roughly $0 in your final outcome if you stay invested\n\n` +
        `**The only losing move is selling.** Your glide path was designed for exactly this.`;
    },
    retirement_account: () => {
      return `**Your retirement account stack:**\n\n` +
        `🎯 **Priority order:**\n` +
        `1. 401(k) to full match → ${fmt(matchAmount)}/yr FREE\n` +
        `2. Roth IRA max → $7,000/yr (${fmtPct(tax.marginal)} bracket = pay taxes NOW)\n` +
        `3. 401(k) beyond match → up to $23,500/yr\n` +
        `4. Taxable brokerage → VTI/VXUS for tax efficiency\n\n` +

        `Career model shows income ${fmt(profile.income)} → ${fmt(career.peak)}. You'll hit ${fmtPct(calcTax(career.peak).marginal)} marginal at peak.\n` +

    tax_strategy: () => {
      return `**Your tax picture:**\n\n` +

        `• Effective rate: ${fmtPct(tax.effective)}\n` +
        `• Marginal rate: ${fmtPct(tax.marginal)}\n\n` +
        `🎯 **Tax alpha opportunities:**\n` +
        `1. **Roth conversions** — Optimal now at ${fmtPct(tax.marginal)}. Peak hits ${fmtPct(calcTax(career.peak).marginal)}.\n` +
        `2. **Asset location** — Bonds in tax-deferred, growth in Roth, indices taxable. Saves 0.3-0.5%/yr = ${fmt(p50F * 0.004)}.\n` +
        `3. **Tax-loss harvesting** — Quarterly rebalance. ~$3K/yr savings.\n` +
        `4. **HSA if eligible** — Triple tax advantage.\n\n` +

    },
    vitals: () => {
      const weak = vitals.components.reduce((m,c) => c.score < m.score ? c : m, vitals.components[0]);
      const strong = vitals.components.reduce((m,c) => c.score > m.score ? c : m, vitals.components[0]);
      return `**Vitals Score: ${vitals.score}/850 (Grade ${vitals.grade})**\n\n` +
        vitals.components.map(c => `• ${c.name}: ${c.score}/100 ${c.score>=80?"✓":c.score>=50?"⚠":"✗"}`).join("\n") + "\n\n" +

// LLM INTEGRATION — Anthropic (default, no key in Claude artifact env) + OpenAI fallback
// ═══════════════════════════════════════════════════════════════════════════
async function callLLM({provider,apiKey,model,messages,system,maxTokens=1024}){
  const p=(provider||"anthropic").toLowerCase();
  if(p==="anthropic"){
    const headers={"Content-Type":"application/json"};
    // When running in Claude.ai artifact env, auth is auto-injected. When standalone,
    // a user-supplied key is attached with the browser-access header.
    if(apiKey){
      headers["x-api-key"]=apiKey;
      headers["anthropic-version"]="2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"]="true";
    }
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers,
      body:JSON.stringify({
        model:model||"claude-sonnet-4-20250514",
        max_tokens:maxTokens,
        system,
        messages
      })
    });
    if(!res.ok){const t=await res.text();throw new Error(`Anthropic ${res.status}: ${t.slice(0,200)}`);}
    const data=await res.json();
    return data.content.filter(c=>c.type==="text").map(c=>c.text).join("\n");
  }
  if(p==="openai"){
    if(!apiKey)throw new Error("OpenAI requires an API key. Add one in Settings.");
    const res=await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
      body:JSON.stringify({
        model:model||"gpt-4o-mini",
        messages:[{role:"system",content:system},...messages],
        max_tokens:maxTokens,
        temperature:0.4
      })
    });
    if(!res.ok){const t=await res.text();throw new Error(`OpenAI ${res.status}: ${t.slice(0,200)}`);}
    const data=await res.json();
    return data.choices[0].message.content;
  }
  throw new Error("Unknown provider: "+provider);
}

const PORTFOLIO_TICKERS=["VTI","VXUS","BND","VNQ","GLD","QQQM","SPY"];

async function fetchLiveMarkets(apiKey){
  if(!apiKey)return null;
  const quotes=[];
  for(const sym of PORTFOLIO_TICKERS){
    try{
      const res=await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${apiKey}`);
      if(!res.ok)continue;
      const d=await res.json();
      if(d.c&&d.c>0){
        quotes.push({symbol:sym,price:d.c,change:d.d||0,changePct:d.dp||0,high:d.h,low:d.l,prevClose:d.pc});
      }
    }catch(e){/* skip ticker */}
  }
  return{quotes,fetchedAt:new Date().toISOString()};
}

function SteadyAI({profile,career,mc,vitals,plaidData,alloc,aiConfig,marketData,onOpenSettings}){

  const[input,setInput]=useState("");
  const[typing,setTyping]=useState(false);
  const[mode,setMode]=useState("auto"); // auto = try LLM, fallback to local
  const[lastError,setLastError]=useState(null);
  const ref=useRef(null);

  useEffect(()=>{
    const welcome=`Hey ${profile.name} — Steady here.\n\n`+
      `**Your snapshot:**\n`+
      `◈ Vitals: ${vitals.score}/850 (Grade ${vitals.grade})\n`+
      `◈ Projected wealth: ${fmt(mc.p50[mc.p50.length-1])}\n`+
      `◈ Lifetime earnings: ${fmt(career.total)}\n`+

      `\nI know your full picture. Ask me anything — retirement scenarios, tax strategy, career moves, market questions. I'll use your specific numbers.`;
    setMsgs([{role:"ai",text:welcome,source:"system"}]);
  },[]);

  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight},[msgs,typing]);

  const processQuery=async(q)=>{
    setMsgs(m=>[...m,{role:"user",text:q}]);
    setTyping(true);
    setLastError(null);

    // Build conversation history for LLM
    const history=msgs.filter(m=>m.source!=="system").map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}));
    history.push({role:"user",content:q});

    let response=null;
    let source="local";

    try{
      const system=buildSteadySystemPrompt(profile,career,mc,vitals,plaidData,alloc,marketData);
      response=await callLLM({
        provider:aiConfig.provider,
        apiKey:aiConfig.apiKey,
        model:aiConfig.model,
        messages:history,
        system,
        maxTokens:1024
      });
      source=aiConfig.provider==="openai"?"openai":"claude";
    }catch(e){
      setLastError(e.message);
      // Fallback to local rule-based engine
      try{
        response=analyzeQuery(q,profile,career,mc,vitals,plaidData,alloc);
        source="fallback";
      }catch(e2){
        response="I had trouble with that one. Try asking about: Vitals, retirement, taxes, career, market, or pricing.";
        source="error";
      }
    }

    setMsgs(m=>[...m,{role:"ai",text:response,source}]);
    setTyping(false);
  };

  const send=()=>{if(!input.trim()||typing)return;const q=input.trim();setInput("");processQuery(q)};

  const prompts=["What if I retire at 60?","Explain my Vitals Score","Market is down, should I sell?","Should I max my 401(k)?","Roth vs Traditional for me?","How much house can I afford?","What's my biggest weakness?","How does SteadyPath compare to Wealthfront?"];

  // Lightweight markdown-ish renderer for **bold**, headers, and bullets
  const renderText=(t)=>{
    const lines=t.split("\n");
    return lines.map((line,li)=>{
      // Render inline bold
      const parts=line.split(/(\*\*[^*]+\*\*)/g);
      const inline=parts.map((p,i)=>p.startsWith("**")&&p.endsWith("**")?h("strong",{key:`${li}-${i}`,style:{color:"#f0c674"}},p.slice(2,-2)):p);
      // Bullet rendering
      if(line.match(/^\s*[•·▪-]\s/)){
        return h("div",{key:li,style:{display:"flex",gap:8,marginLeft:4}},
          h("span",{style:{color:"#5fb8d6",flexShrink:0}},"•"),
          h("span",null,...inline.map((x,i)=>typeof x==="string"&&i===0?x.replace(/^\s*[•·▪-]\s/,""):x))
        );
      }
      return h("div",{key:li,style:line.trim()===""?{height:6}:{}},inline);
    });
  };

  const sourceLabel=(src)=>{
    if(src==="claude")return{l:"CLAUDE",c:"#c0b3e0"};
    if(src==="openai")return{l:"GPT",c:"#7dd6a8"};
    if(src==="fallback")return{l:"LOCAL · LLM OFFLINE",c:"#f0c674"};
    if(src==="error")return{l:"ERROR",c:"#e88b8b"};
    return{l:"STEADY AI",c:"#c0b3e0"};
  };

  const clearChat=()=>{
    const welcome=`Hey ${profile.name} — Steady here.\n\n`+
      `**Your snapshot:**\n`+
      `◈ Vitals: ${vitals.score}/850 (Grade ${vitals.grade})\n`+
      `◈ Projected wealth: ${fmt(mc.p50[mc.p50.length-1])}\n`+
      `◈ Lifetime earnings: ${fmt(career.total)}\n`+
      (marketData?`◈ Markets: live data on ${marketData.quotes.length} tickers\n`:"")+
      `\nFresh start. What's on your mind?`;
    setMsgs([{role:"ai",text:welcome,source:"system"}]);
    setLastError(null);
  };

  return h("div",{style:{display:"flex",flexDirection:"column",height:"100%"}},
    h("div",{ref,style:{flex:1,overflowY:"auto",padding:"20px 24px",display:"flex",flexDirection:"column",gap:14}},
      msgs.map((m,i)=>{
        const lbl=sourceLabel(m.source);
        return h("div",{key:i,className:"fade-up",style:{alignSelf:m.role==="user"?"flex-end":"flex-start",maxWidth:"85%",padding:"12px 16px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.role==="user"?"linear-gradient(135deg,#1a4a5a,#2a6a7a)":"linear-gradient(180deg,rgba(165,148,212,0.04) 0%,rgba(255,255,255,0.018) 100%)",border:`1px solid ${m.role==="user"?"rgba(95,184,214,0.3)":"rgba(165,148,212,0.12)"}`,fontSize:13.5,lineHeight:1.65,color:"#e8edf2"}},
          m.role==="ai"&&h("div",{style:{fontSize:9,color:lbl.c,fontWeight:700,marginBottom:6,letterSpacing:1.5,fontFamily:"JetBrains Mono",display:"flex",alignItems:"center",gap:6}},"◈ ",lbl.l),
          m.role==="user"?m.text:renderText(m.text)
        );
      }),
      typing&&h("div",{style:{alignSelf:"flex-start",padding:"14px 18px",borderRadius:"16px 16px 16px 4px",background:"rgba(165,148,212,0.05)",border:"1px solid rgba(165,148,212,0.15)"}},
        h("div",{className:"typing-dots"},h("span"),h("span"),h("span"))
      ),
      lastError&&!typing&&h("div",{style:{alignSelf:"center",fontSize:10,color:"#5a6878",fontFamily:"JetBrains Mono",padding:"6px 12px",borderRadius:6,background:"rgba(232,139,139,0.05)",border:"1px solid rgba(232,139,139,0.15)"}},
        "LLM unavailable · ",h("button",{onClick:onOpenSettings,style:{background:"none",border:"none",color:"#f0c674",cursor:"pointer",textDecoration:"underline",fontFamily:"inherit",fontSize:"inherit"}},"check settings")
      )
    ),
    msgs.length<=1&&h("div",{style:{padding:"0 24px 8px",display:"flex",flexWrap:"wrap",gap:6}},
      prompts.map((p,i)=>h("button",{key:i,onClick:()=>processQuery(p),style:{cursor:"pointer",display:"inline-flex",alignItems:"center",padding:"4px 10px",borderRadius:20,background:"rgba(165,148,212,0.06)",border:"1px solid rgba(165,148,212,0.2)",fontSize:11,color:"#c0b3e0",fontFamily:"JetBrains Mono",letterSpacing:0.3}},p))
    ),
    h("div",{style:{padding:"14px 24px",borderTop:"1px solid rgba(255,255,255,0.05)",display:"flex",gap:10,alignItems:"center"}},
      msgs.length>1&&h("button",{onClick:clearChat,title:"Clear conversation",style:{padding:"9px 11px",borderRadius:9,background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.06)",color:"#5a6878",fontSize:13,cursor:"pointer"}},"⟲"),
      h("input",{className:"input-field",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&send(),placeholder:typing?"Steady is thinking...":"Ask Steady anything...",disabled:typing,style:{flex:1,opacity:typing?0.5:1}}),
      h("button",{onClick:send,disabled:typing||!input.trim(),style:{background:typing?"rgba(165,148,212,0.3)":"linear-gradient(180deg,#a594d4,#8d7ac0)",color:"#fff",padding:"11px 22px",borderRadius:10,fontWeight:600,fontSize:13.5,cursor:typing?"not-allowed":"pointer",border:"none",boxShadow:"0 4px 16px rgba(165,148,212,0.25)",opacity:typing||!input.trim()?0.5:1}},"Send")
    )
  );
}

// ═══ CHAT ONBOARDING ═══
const CHAT_FLOW=
  {id:"welcome",message:()=>"Hi! I'm Steady — I'll help you build a complete wealth plan in a conversation. First, what should I call you?",input:{type:"text",field:"name",placeholder:"Your first name"},validate:v=>v.trim().length>0?null:"Please enter your name"},
  {id:"age",message:p=>`Nice to meet you, ${[p.name}. How old are you?`,input:{type:"number",field:"age",placeholder:"e.g., 27",min:16,max:85},validate:v=>v>=16&&v<=85?null:"Between 16 and 85"},
  {id:"role",message:()=>`What's your current job title? I'll pull real BLS salary data.`,input:{type:"text",field:"jobTitle",placeholder:"e.g., Software Engineer"},validate:v=>v.trim().length>1?null:"Please enter job title",action:"salary_lookup"},
  {id:"location",message:(p,sd)=>sd?`I found your role. National median for ${sd.title}: ${fmtFull(sd.baseSalary)}/yr. Where are you based?`:`Where are you based?`,input:{type:"text",field:"location",placeholder:"e.g., San Francisco"},validate:()=>null,action:"location_adjust"},
  {id:"income",message:(p,sd)=>{const s=sd?.medianSalary||75000;return`Based on BLS data for ${p.location||"US"}, ${p.jobTitle} averages ${fmtFull(s)}/yr. What's your actual gross income?`},input:{type:"number",field:"income",placeholder:"e.g., 85000",suggestFromSalary:true},validate:v=>v>0?null:"Please enter income"},
  {id:"savings",message:()=>`How much do you have saved/invested across all accounts?`,input:{type:"number",field:"savings",placeholder:"e.g., 15000"},validate:()=>null},
  {id:"debt",message:()=>`Any outstanding debt? (Student loans, credit cards — not mortgage)`,input:{type:"number",field:"totalDebt",placeholder:"0 if none"},validate:()=>null},
  {id:"retire",message:()=>`When do you want to retire?`,input:{type:"number",field:"retireAge",placeholder:"e.g., 65"},validate:(v,p)=>v>p.age?null:"Must be after current age"},
  {id:"match",message:()=>`Does your employer offer a 401(k) match?`,input:{type:"select",field:"employerMatchKey",options:[{val:"none",label:"No match"},{val:"50pct_6",label:"50% up to 6%"},{val:"100pct_3",label:"100% up to 3%"},{val:"100pct_4",label:"100% up to 4%"},{val:"100pct_6",label:"100% up to 6%"}]},validate:()=>null},
  {id:"risk",message:p=>`How do you feel about risk? ${p.retireAge-p.age} years until retirement.`,input:{type:"select",field:"riskProfile",options:[{val:"preserver",label:"Preserver — Safety first"},{val:"conservative",label:"Conservative — Stability"},{val:"balanced",label:"Balanced — Mix"},{val:"growth",label:"Growth — Long-term building"},{val:"magnificent",label:"Magnificent — Maximum upside"}]},validate:()=>null},
];

function ChatOnboarding({profile,setProfile,onComplete}){
  const[step,setStep]=useState(0);
  const[messages,setMessages]=useState([]);
  const[input,setInput]=useState("");
  const[selectVal,setSelectVal]=useState("");
  const[typing,setTyping]=useState(false);
  const[error,setError]=useState("");
  const[salaryData,setSalaryData]=useState(null);
  const[isLookingUp,setIsLookingUp]=useState(false);
  const scrollRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight},[messages,typing]);

  useEffect(()=>{
    setTyping(true);
    setTimeout(()=>{
      setMessages([{role:"ai",text:CHAT_FLOW[0].message(profile),step:0}]);
      setTyping(false);
      setTimeout(()=>inputRef.current?.focus(),100);
    },700);
  },[]);

  const advance=async(userInput)=>{
    const cfg=CHAT_FLOW[step];
    const field=cfg.input.field;
    let value=userInput;
    if(cfg.input.type==="number")value=parseFloat(userInput)||0;
    const err=cfg.validate(value,{...profile,[field]:value});
    if(err){setError(err);return}
    setError("");
    const updated={...profile,[field]:value};
    setProfile(updated);
    let displayVal=userInput;
    if(cfg.input.type==="number")displayVal=fmtFull(value);
    if(cfg.input.type==="select")displayVal=cfg.input.options.find(o=>o.val===value)?.label||value;
    setMessages(m=>[...m,{role:"user",text:displayVal,step}]);
    setInput("");setSelectVal("");

    if(cfg.action==="salary_lookup"){
      setIsLookingUp(true);setTyping(true);
      await new Promise(r=>setTimeout(r,1100));
      const result=lookupSalary(value,updated.location);
      setSalaryData(result);
      if(result){
        setMessages(m=>[...m,{role:"ai",text:"✓ Pulling from BLS Occupational Employment Statistics...",step,isStatus:true}]);
        await new Promise(r=>setTimeout(r,500));
      }
      setIsLookingUp(false);setTyping(false);
    }
    if(cfg.action==="location_adjust"&&salaryData){
      setTyping(true);
      await new Promise(r=>setTimeout(r,700));
      const adj=lookupSalary(updated.jobTitle,value);
      if(adj){
        setSalaryData(adj);
        const d=adj.medianSalary-adj.baseSalary;
        if(adj.multiplier!==1){
          setMessages(m=>[...m,{role:"ai",text:`Adjusted for ${value}: ${d>=0?"+":""}${fmtFull(d)} (${((adj.multiplier-1)*100).toFixed(0)}% ${d>=0?"premium":"discount"})`,step,isStatus:true}]);
          await new Promise(r=>setTimeout(r,500));
        }
      }
      setTyping(false);
    }

    if(step<CHAT_FLOW.length-1){
      setTyping(true);
      await new Promise(r=>setTimeout(r,800));
      const next=CHAT_FLOW[step+1];
      setMessages(m=>[...m,{role:"ai",text:next.message(updated,salaryData),step:step+1}]);
      setTyping(false);
      setStep(step+1);
      if(next.input.suggestFromSalary&&salaryData)setInput(String(salaryData.medianSalary));
      setTimeout(()=>inputRef.current?.focus(),100);
    }else{
      setTyping(true);
      setMessages(m=>[...m,{role:"ai",text:"Perfect! Building your plan — 750 Monte Carlo simulations running now...",step:-1}]);
      await new Promise(r=>setTimeout(r,1200));
      onComplete(updated);
    }
  };

  const handleSubmit=()=>{
    const cfg=CHAT_FLOW[step];
    if(cfg.input.type==="select"){if(!selectVal){setError("Select an option");return}advance(selectVal)}
    else{if(!input.trim()){setError("Enter a value");return}advance(input)}
  };

  const cfg=CHAT_FLOW[step];
  const canInput=!typing&&!isLookingUp&&step<CHAT_FLOW.length;

  return h("div",{style:{maxWidth:720,margin:"0 auto",padding:"32px 24px",minHeight:"100vh",display:"flex",flexDirection:"column"}},
    h("div",{style:{marginBottom:28,display:"flex",alignItems:"center",gap:12}},
      h("div",{style:{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#5fb8d6 0%,#d4a849 100%)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,color:"#fff",fontFamily:"Fraunces",fontSize:18,boxShadow:"0 2px 12px rgba(95,184,214,0.25)"}},"S"),
      h("div",{style:{flex:1}},
        h("div",{style:{fontSize:13,fontWeight:600,letterSpacing:2,fontFamily:"JetBrains Mono",color:"#a3afb8"}},"STEADYPATH"),
        h("div",{style:{fontSize:11,color:"#5a6878",fontFamily:"JetBrains Mono",marginTop:2}},`Setup · ${Math.min(step+1,CHAT_FLOW.length)}/${CHAT_FLOW.length}`)
      ),
      h("div",{style:{width:120,height:3,background:"rgba(255,255,255,0.05)",borderRadius:2,overflow:"hidden"}},
        h("div",{style:{height:"100%",width:`${((step+1)/CHAT_FLOW.length)*100}%`,background:"linear-gradient(90deg,#5fb8d6 0%,#a594d4 50%,#d4a849 100%)",transition:"width 0.4s"}})
      )
    ),
    h("div",{ref:scrollRef,style:{flex:1,overflowY:"auto",marginBottom:20,paddingRight:8}},
      messages.map((m,i)=>h("div",{key:i,className:"fade-up",style:{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:14}},
        m.role==="ai"&&h("div",{style:{width:28,height:28,borderRadius:"50%",background:m.isStatus?"rgba(212,168,73,0.15)":"linear-gradient(135deg,#5fb8d6 0%,#a594d4 100%)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,marginRight:10,flexShrink:0,color:m.isStatus?"#f0c674":"#fff",fontWeight:700,border:`1px solid ${m.isStatus?"rgba(212,168,73,0.3)":"rgba(95,184,214,0.4)"}`,fontFamily:"Fraunces",marginTop:4}},m.isStatus?"✓":"S"),
        h("div",{style:{maxWidth:"78%",padding:"12px 16px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.role==="user"?"linear-gradient(135deg,#1a4a5a,#2a6a7a)":m.isStatus?"rgba(212,168,73,0.06)":"linear-gradient(180deg,rgba(165,148,212,0.04) 0%,rgba(255,255,255,0.018) 100%)",border:`1px solid ${m.role==="user"?"rgba(95,184,214,0.3)":m.isStatus?"rgba(212,168,73,0.18)":"rgba(165,148,212,0.12)"}`,fontSize:14,color:"#e8edf2",lineHeight:1.6,whiteSpace:"pre-wrap"}},m.text)
      )),
      typing&&h("div",{className:"fade-in",style:{display:"flex",marginBottom:14}},
        h("div",{style:{width:28,height:28,borderRadius:"50%",background:"linear-gradient(135deg,#5fb8d6 0%,#a594d4 100%)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,marginRight:10,color:"#fff",fontWeight:700,border:"1px solid rgba(165,148,212,0.4)",fontFamily:"Fraunces",marginTop:4}},"S"),
        h("div",{style:{padding:"14px 18px",background:"rgba(165,148,212,0.05)",border:"1px solid rgba(165,148,212,0.15)",borderRadius:"16px 16px 16px 4px"}},
          isLookingUp?h("div",{style:{display:"flex",alignItems:"center",gap:10}},
            h("div",{className:"typing-dots"},h("span"),h("span"),h("span")),
            h("span",{style:{fontSize:12,color:"#8a96a3",fontFamily:"JetBrains Mono"}},"Querying BLS database...")
          ):h("div",{className:"typing-dots"},h("span"),h("span"),h("span"))
        )
      )
    ),
    canInput&&cfg&&h("div",{className:"fade-up",style:{paddingTop:16,borderTop:"1px solid rgba(255,255,255,0.05)"}},
      error&&h("div",{style:{fontSize:12,color:"#e88b8b",marginBottom:8,fontFamily:"JetBrains Mono"}},error),
      cfg.input.type==="select"
        ?h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
            cfg.input.options.map((opt,i)=>h("button",{key:i,onClick:()=>{setSelectVal(opt.val);setTimeout(()=>advance(opt.val),100)},style:{padding:"13px 16px",borderRadius:10,background:selectVal===opt.val?"rgba(95,184,214,0.12)":"rgba(255,255,255,0.025)",border:`1px solid ${selectVal===opt.val?"rgba(95,184,214,0.4)":"rgba(255,255,255,0.08)"}`,color:"#e8edf2",fontSize:13.5,cursor:"pointer",textAlign:"left"}},opt.label))
          )
        :h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
            h("input",{ref:inputRef,className:"input-field",type:cfg.input.type==="number"?"number":"text",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&handleSubmit(),placeholder:cfg.input.placeholder,style:{flex:1,padding:"12px 16px",fontSize:14.5}}),
            h("button",{className:"btn-primary",onClick:handleSubmit,style:{padding:"12px 22px"}},step===CHAT_FLOW.length-1?"Build Plan →":"Continue →")
          )
    )
  );
}

// ═══ APP ═══
function App(){
  const[view,setView]=useState("welcome");
  const[settingsOpen,setSettingsOpen]=useState(false);
  const[profile,setProfile]=useState({
    name:"",age:27,jobTitle:"",location:"",income:75000,savings:15000,
    totalDebt:0,retireAge:65,riskProfile:"balanced",savingsRate:15,
    employerMatchKey:"50pct_6",
  });
  const[career,setCareer]=useState(null);
  const[mc,setMc]=useState(null);
  const[vitals,setVitals]=useState(null);
  const[alloc,setAlloc]=useState(null);
  const[plaidData,setPlaidData]=useState(null);
  // AI config — Anthropic default works without key inside Claude.ai artifact
  const[aiConfig,setAiConfig]=useState({
    provider:"anthropic",
    apiKey:"",
    model:"claude-sonnet-4-20250514",
    finnhubKey:""
  });
  const[marketData,setMarketData]=useState(null);
  const[marketsLoading,setMarketsLoading]=useState(false);

  const refreshMarkets=async()=>{
    if(!aiConfig.finnhubKey)return;
    setMarketsLoading(true);
    try{
      const data=await fetchLiveMarkets(aiConfig.finnhubKey);
      setMarketData(data);
    }catch(e){/* silent */}
    setMarketsLoading(false);
  };

  // Auto-refresh markets when key is added
  useEffect(()=>{if(aiConfig.finnhubKey)refreshMarkets();},[aiConfig.finnhubKey]);

  const computeAll=(fp)=>{
    const withRate={...fp,savingsRate:fp.savingsRate||15};
    const ct=detectCareer(withRate.jobTitle);
    const c=projectCareer(withRate.age,withRate.retireAge,withRate.income,ct);
    setCareer(c);
    const a=RISK[withRate.riskProfile];
    setAlloc(a);
    const mi=MATCH_OPT[withRate.employerMatchKey];
    const ac=withRate.income*withRate.savingsRate/100;
    const ma=withRate.income*mi.rate;
    const m=runMC({startAge:withRate.age,endAge:withRate.retireAge,savings:withRate.savings,annualContrib:ac,contribGrowth:0.03,mu:a.mu,sigma:a.sigma,n:750,matchAmount:ma});
    setMc(m);
    setVitals(calcVitals(withRate,m));
    setProfile(withRate);
  };

  const settingsModal=h(SettingsModal,{
    open:settingsOpen,
    onClose:()=>setSettingsOpen(false),
    aiConfig,setAiConfig,marketData,refreshMarkets,marketsLoading
  });

  if(view==="welcome")return h("div",null,h(Welcome,{onStart:()=>setView("chat")}),settingsModal);
  if(view==="chat")return h("div",null,h(ChatOnboarding,{profile,setProfile,onComplete:fp=>{computeAll(fp);setView("plaid")}}),settingsModal);
  if(view==="plaid")return h("div",null,h(PlaidConnect,{onComplete:d=>{setPlaidData(d);setView("loading")},onSkip:()=>setView("loading")}),settingsModal);
  if(view==="loading")return h("div",null,h(LoadingScreen,{onComplete:()=>setView("dashboard")}),settingsModal);
  if(view==="dashboard"&&career&&mc&&vitals&&alloc)return h("div",null,h(Dashboard,{profile,career,mc,vitals,alloc,plaidData,aiConfig,marketData,marketsLoading,refreshMarkets,onOpenSettings:()=>setSettingsOpen(true)}),settingsModal);
  return h("div",{style:{padding:40}},"Loading...");
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
